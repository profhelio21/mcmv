<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Interessados MCMV</title>
<style>
  :root{--verde-escuro:#0b3d3a;--verde:#0f766e;--menta:#e6f6f3;--sol:#fbbf24;--tinta:#10282a;--cinza:#5b7173;--linha:#d9e5e3;--fundo:#f3f7f6;--erro:#c2410c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--fundo);color:var(--tinta);font-size:15px;line-height:1.45}
  button{font:inherit;cursor:pointer}
  .oculto{display:none!important}

  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--verde-escuro),var(--verde))}
  .login form{background:#fff;border-radius:18px;padding:2rem;width:min(100%,24rem);box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .login h1{font-size:1.35rem;color:var(--verde-escuro);margin-bottom:.3rem}
  .login p{color:var(--cinza);margin-bottom:1.2rem;font-size:.9rem}
  .login input{width:100%;font:inherit;padding:.8rem 1rem;border:2px solid var(--linha);border-radius:12px;margin-bottom:.8rem}
  .login input:focus{outline:0;border-color:var(--verde)}
  .login .msg{color:var(--erro);font-weight:600;min-height:1.3em;margin-bottom:.4rem;font-size:.88rem}
  .btn{border:0;border-radius:10px;padding:.65rem 1.1rem;font-weight:700;background:var(--verde);color:#fff}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:#fff;color:var(--verde-escuro);border:1px solid var(--linha)}
  .btn.sol{background:var(--sol);color:#3b2a00}
  .btn.perigo{background:#fff;color:var(--erro);border:1px solid #f1c4b3}
  .login .btn{width:100%;padding:.85rem}

  /* painel */
  header{background:var(--verde-escuro);color:#fff;padding:.9rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  header h1{font-size:1.1rem;flex:1;min-width:12rem}
  main{max-width:1280px;margin:0 auto;padding:1.2rem}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.8rem;margin-bottom:1.2rem}
  .card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:1rem 1.1rem}
  .card small{color:var(--cinza);font-weight:600;display:block}
  .card b{font-size:1.7rem;color:var(--verde-escuro);display:block;line-height:1.2}
  .barra{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
  .barra input[type=search]{flex:1;min-width:12rem;font:inherit;padding:.65rem .9rem;border:1px solid var(--linha);border-radius:10px}
  .barra select{font:inherit;padding:.6rem .8rem;border:1px solid var(--linha);border-radius:10px;background:#fff}
  .tabela-wrap{background:#fff;border:1px solid var(--linha);border-radius:14px;overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:820px}
  th{background:var(--menta);color:var(--verde-escuro);text-align:left;padding:.7rem .8rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;white-space:nowrap}
  td{padding:.65rem .8rem;border-top:1px solid var(--linha);vertical-align:middle}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f7fbfa}
  .num{font-weight:800;color:var(--verde);white-space:nowrap}
  .tag{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
  .tag.compativel{background:#dcfce7;color:#166534}.tag.verificar{background:#fef3c7;color:#92400e}
  .vazio{padding:2.5rem;text-align:center;color:var(--cinza)}
  a.wa{color:var(--verde);font-weight:600;text-decoration:none}a.wa:hover{text-decoration:underline}

  /* detalhe */
  .overlay{position:fixed;inset:0;background:rgba(5,30,28,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
  .detalhe{background:#fff;border-radius:16px;width:min(100%,38rem);max-height:90vh;overflow:auto;padding:1.4rem}
  .detalhe h2{color:var(--verde-escuro);font-size:1.2rem;margin-bottom:.2rem}
  .detalhe dl{display:grid;grid-template-columns:11rem 1fr;gap:.35rem .8rem;margin:1rem 0}
  .detalhe dt{color:var(--cinza);font-weight:600}
  .detalhe .acoes{display:flex;gap:.6rem;justify-content:space-between;margin-top:1rem}
  .toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--verde-escuro);color:#fff;padding:.7rem 1.2rem;border-radius:10px;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  @media (max-width:600px){.detalhe dl{grid-template-columns:1fr}.detalhe dt{margin-top:.4rem}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="telaLogin">
  <form id="formLogin">
    <h1>Painel de Interessados</h1>
    <p>Acesso restrito à administração.</p>
    <input type="password" id="senha" placeholder="Senha de administrador" autocomplete="current-password" required autofocus>
    <div class="msg" id="msgLogin"></div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>

<!-- PAINEL -->
<div id="telaPainel" class="oculto">
  <header>
    <h1>📋 Interessados · Minha Casa, Minha Vida</h1>
    <button class="btn sec" id="btnAtualizar" type="button">↻ Atualizar</button>
    <button class="btn sol" id="btnExcel" type="button">⬇ Baixar Excel (.xlsx)</button>
    <button class="btn sec" id="btnSair" type="button">Sair</button>
  </header>
  <main>
    <div class="cards">
      <div class="card"><small>Total de interessados</small><b id="kTotal">0</b></div>
      <div class="card"><small>Cadastros hoje</small><b id="kHoje">0</b></div>
      <div class="card"><small>Perfil compatível</small><b id="kOtimo">0</b></div>
      <div class="card"><small>Renda média da família</small><b id="kRenda">—</b></div>
      <div class="card"><small>Pelo quiosque</small><b id="kQuiosque">0</b></div>
    </div>
    <div class="barra">
      <input type="search" id="busca" placeholder="Buscar por nome, CPF, telefone ou bairro…">
      <select id="filtroFaixa">
        <option value="">Todas as faixas</option><option>Faixa 1</option><option>Faixa 2</option><option>Faixa 3</option><option>Faixa 4</option><option value="__acima">Acima das faixas</option>
      </select>
    </div>
    <div class="tabela-wrap">
      <table>
        <thead><tr><th>Interessado</th><th>Data/Hora</th><th>Nome</th><th>Telefone</th><th>Bairro</th><th>Renda familiar</th><th>Faixa</th><th>Triagem</th></tr></thead>
        <tbody id="corpo"></tbody>
      </table>
      <div class="vazio oculto" id="vazio">Nenhum cadastro encontrado.</div>
    </div>
  </main>
</div>

<div class="overlay oculto" id="overlay"><div class="detalhe" id="detalhe"></div></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const brl = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtCpf = c => c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
const fmtTel = t => t.length === 11 ? t.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3") : t.replace(/(\d{2})(\d{4})(\d{4})/, "($1) $2-$3");
const fmtDH = iso => new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Fortaleza", dateStyle: "short", timeStyle: "short" }).format(new Date(iso));
const dia = iso => new Date(iso).toLocaleDateString("sv-SE", { timeZone: "America/Fortaleza" });
const R = {
  estadoCivil: { solteiro: "Solteiro(a)", casado: "Casado(a)", uniao_estavel: "União estável", divorciado: "Divorciado(a)", viuvo: "Viúvo(a)" },
  ocupacao: { clt: "CLT (carteira assinada)", autonomo: "Autônomo(a)", servidor: "Servidor(a) público(a)", aposentado: "Aposentado(a)/Pensionista", empresario: "Empresário(a)", sem_renda: "Sem renda", outro: "Outro" },
  sn: { sim: "Sim", nao: "Não", nao_sei: "Não sei" }, tri: { compativel: "Perfil compatível", verificar: "Verificar elegibilidade" },
};
let todos = [];
const triagemDe = x => x.triagem || (x.resultado === "otimo" ? "compativel" : x.resultado === "analise" ? "verificar" : "");

async function api(rota, opc = {}) {
  const r = await fetch("/api/admin/" + rota, { credentials: "same-origin", ...opc });
  if (r.status === 401 && rota !== "login") { mostrarLogin(); throw new Error("sessao"); }
  return r;
}
function mostrarLogin() { $("#telaPainel").classList.add("oculto"); $("#telaLogin").classList.remove("oculto"); $("#senha").value = ""; $("#senha").focus(); }
function mostrarPainel() { $("#telaLogin").classList.add("oculto"); $("#telaPainel").classList.remove("oculto"); }
function aviso(txt) { const t = document.createElement("div"); t.className = "toast"; t.textContent = txt; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }

$("#formLogin").addEventListener("submit", async e => {
  e.preventDefault(); $("#msgLogin").textContent = "";
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try {
    const r = await api("login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ senha: $("#senha").value }) });
    const j = await r.json();
    if (!r.ok) { $("#msgLogin").textContent = j.erro || "Falha ao entrar."; return; }
    mostrarPainel(); carregar();
  } catch { $("#msgLogin").textContent = "Sem conexão. Tente novamente."; }
  finally { btn.disabled = false; }
});
$("#btnSair").addEventListener("click", async () => { await fetch("/api/admin/logout", { method: "POST" }); mostrarLogin(); });
$("#btnAtualizar").addEventListener("click", carregar);
$("#btnExcel").addEventListener("click", async () => {
  const b = $("#btnExcel"); b.disabled = true; b.textContent = "Gerando…";
  try {
    const r = await api("exportar");
    if (!r.ok) throw new Error();
    const blob = await r.blob();
    const nome = (/filename="([^"]+)"/.exec(r.headers.get("content-disposition") || "") || [])[1] || "interessados-mcmv.xlsx";
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { if (e.message !== "sessao") aviso("Não foi possível gerar a planilha."); }
  finally { b.disabled = false; b.textContent = "⬇ Baixar Excel (.xlsx)"; }
});

async function carregar() {
  try {
    const r = await api("inscricoes"); const j = await r.json();
    todos = j.itens.map(x => ({ ...x, busca: `${x.nome} ${x.cpf} ${x.telefone} ${x.bairro} ${x.protocolo}`.toLowerCase() }));
    indicadores(); desenhar();
  } catch (e) { if (e.message !== "sessao") aviso("Erro ao carregar os dados."); }
}
function indicadores() {
  const hoje = dia(new Date().toISOString());
  $("#kTotal").textContent = todos.length;
  $("#kHoje").textContent = todos.filter(x => dia(x.criadoEm) === hoje).length;
  $("#kOtimo").textContent = todos.filter(x => triagemDe(x) === "compativel").length;
  $("#kQuiosque").textContent = todos.filter(x => x.origem === "quiosque").length;
  $("#kRenda").textContent = todos.length ? brl(todos.reduce((s, x) => s + x.renda, 0) / todos.length) : "—";
}
function desenhar() {
  const q = $("#busca").value.trim().toLowerCase();
  const qNum = q.replace(/\D/g, "");   // permite buscar CPF/telefone com ou sem pontuação
  const f = $("#filtroFaixa").value;
  const lista = todos.filter(x => (!q || x.busca.includes(q) || (qNum && x.cpf.includes(qNum)) || (qNum && x.telefone.includes(qNum)))
      && (!f || (f === "__acima" ? !x.faixa : x.faixa === f))).slice().reverse();
  $("#vazio").classList.toggle("oculto", lista.length > 0);
  $("#corpo").innerHTML = lista.map(x => `<tr data-k="${esc(x.chave)}">
    <td class="num">Interessado ${x.numero}</td><td>${esc(fmtDH(x.criadoEm))}</td><td><b>${esc(x.nome)}</b></td>
    <td><a class="wa" href="https://wa.me/55${esc(x.telefone)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(fmtTel(x.telefone))}</a></td>
    <td>${esc(x.bairro)}</td><td>${brl(x.renda)}</td><td>${esc(x.faixa || "Acima das faixas")}</td>
    <td><span class="tag ${esc(triagemDe(x))}">${esc(R.tri[triagemDe(x)] || "—")}</span></td></tr>`).join("");
}
$("#busca").addEventListener("input", desenhar);
$("#filtroFaixa").addEventListener("change", desenhar);
$("#corpo").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) abrir(tr.dataset.k); });

function abrir(chave) {
  const x = todos.find(t => t.chave === chave); if (!x) return;
  const linhas = [
    ["Protocolo", x.protocolo], ["Cadastrado em", fmtDH(x.criadoEm)], ["CPF", fmtCpf(x.cpf)], ["Nascimento", x.nascimento.split("-").reverse().join("/")],
    ["Telefone / WhatsApp", fmtTel(x.telefone)], ["E-mail", x.email || "—"], ["Cidade / Bairro", `${x.cidade} / ${x.bairro}`],
    ["Estado civil", R.estadoCivil[x.estadoCivil]], ["Pessoas na família", x.pessoasFamilia], ["Ocupação", R.ocupacao[x.ocupacao]],
    ["Renda familiar", brl(x.renda)], ["Faixa estimada", x.faixa || "Acima das faixas"], ["Triagem interna", R.tri[triagemDe(x)] || "—"], ["Possui imóvel?", R.sn[x.possuiImovel]],
    ["Já foi beneficiado?", R.sn[x.jaBeneficiado]], ["CadÚnico?", R.sn[x.cadUnico]], ["Origem", x.origem === "quiosque" ? "Quiosque" : "Link"],
  ];
  $("#detalhe").innerHTML = `<h2>Interessado ${x.numero} · ${esc(x.nome)}</h2>
    <dl>${linhas.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="acoes"><button class="btn perigo" id="btnExcluir" type="button">Excluir cadastro</button><button class="btn" id="btnFechar" type="button">Fechar</button></div>`;
  $("#overlay").classList.remove("oculto");
  $("#btnFechar").onclick = fechar;
  $("#btnExcluir").onclick = async () => {
    if (!confirm(`Excluir o cadastro de ${x.nome}? Esta ação não pode ser desfeita.`)) return;
    const r = await api("inscricoes/" + encodeURIComponent(x.chave), { method: "DELETE" });
    if (r.ok) { fechar(); aviso("Cadastro excluído."); carregar(); } else aviso("Não foi possível excluir.");
  };
}
function fechar() { $("#overlay").classList.add("oculto"); }
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") fechar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });

// Já existe sessão válida?
(async () => { try { const r = await fetch("/api/admin/sessao", { credentials: "same-origin" }); if (r.ok) { mostrarPainel(); carregar(); } } catch {} })();
})();
</script>
</body>
</html>
